      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli @capacitor/assets

      - name: Crear el proyecto de Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          node scripts/set-version.mjs "$VERSION_NAME" "${{ github.run_number }}"

      - name: Generar los iconos
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' \
            || echo "::warning::No se pudieron generar los iconos; se usara el icono por defecto de Capacitor."

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar el bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Firmar el AAB
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$RUNNER_TEMP/upload-key.jks" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/verificacion.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verificacion.txt" || { echo "::error::El AAB no quedo firmado correctamente."; exit 1; }
          mkdir -p salida
          cp "$AAB" "salida/aira-alhue-v$VERSION_NAME-build${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload-key.jks"

      - name: Resumen
        run: |
          {
            echo "### Listo"
            echo "- Version: $VERSION_NAME (build ${{ github.run_number }})"
            echo "- Capacitor: $(npx cap --version)"
            echo "- Node: $(node -v)"
            echo "Descarga el archivo en la seccion **Artifacts** al final de esta pagina."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el AAB para que lo descargues
        uses: actions/upload-artifact@v4
        with:
          name: AIRA-AAB-build-${{ github.run_number }}
          path: salida/*.aab
