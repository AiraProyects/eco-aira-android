name: AIRA Android

# Este es el UNICO archivo que necesitas. Al ejecutarlo crea solo el proyecto de Android.
# Para cambiar la version visible de la app, edita la linea VERSION_NAME de abajo.

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Que quieres hacer?"
        type: choice
        default: compilar
        options:
          - compilar
          - crear-llave

env:
  VERSION_NAME: "1.0.0"
  APP_ID: "com.airaproyects.aira"
  APP_URL: "https://eco-aira.lovable.app"

jobs:
  crear-llave:
    if: ${{ inputs.accion == 'crear-llave' }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Revisar que se pueda crear la llave
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "::error::Ya existe el secreto KEYSTORE_BASE64. No crees otra llave: Play Store conoce la anterior."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Falta el secreto KEYSTORE_PASSWORD. Creala primero (ver la guia, Parte 2)."
            exit 1
          fi
          if [ "${#KEYSTORE_PASSWORD}" -lt 8 ]; then
            echo "::error::La contrasena debe tener al menos 8 caracteres."
            exit 1
          fi

      - name: Crear la llave
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore aira-upload-key.jks \
            -alias aira \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEYSTORE_PASSWORD \
            -dname "CN=AIRA Alhue, OU=AIRA, O=AIRA Proyects, C=CL"
          base64 -w 0 aira-upload-key.jks > aira-upload-key.base64.txt

      - name: Guardar la llave para que la descargues
        uses: actions/upload-artifact@v4
        with:
          name: llave-de-firma
          path: |
            aira-upload-key.jks
            aira-upload-key.base64.txt
          retention-days: 2

  compilar:
    if: ${{ inputs.accion == 'compilar' }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: aira
    steps:
      - name: Revisar que la llave este configurada
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos KEYSTORE_BASE64 y/o KEYSTORE_PASSWORD. Primero ejecuta la accion crear-llave (ver la guia)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Crear los archivos del proyecto
        run: |
          set -e
          mkdir -p scripts www assets

          cat > package.json <<'AIRA_EOF'
          {"name":"eco-aira-android","version":"1.0.0","private":true}
          AIRA_EOF

          cat > capacitor.config.json <<AIRA_EOF
          {
            "appId": "$APP_ID",
            "appName": "AIRA Alhu\u00e9",
            "webDir": "www",
            "server": {
              "url": "$APP_URL",
              "cleartext": false,
              "allowNavigation": [
                "eco-aira.lovable.app",
                "*.supabase.co",
                "*.googleapis.com",
                "*.gstatic.com"
              ]
            },
            "android": {
              "allowMixedContent": false
            }
          }
          AIRA_EOF

          cat > www/index.html <<AIRA_EOF
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
            <title>AIRA Alhu&#233;</title>
            <style>
              body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
                     font-family: system-ui, sans-serif; background: #ecfdf5; color: #064e3b; text-align: center; padding: 24px; }
              h1 { font-size: 1.4rem; margin: 0 0 8px; }
              p { margin: 0 0 20px; }
              button { background: #059669; color: #fff; border: 0; border-radius: 14px; padding: 12px 22px; font-size: 1rem; font-weight: 700; }
            </style>
          </head>
          <body>
            <main>
              <h1>AIRA Alhu&#233;</h1>
              <p>No se pudo conectar. Revisa tu conexi&#243;n a internet e int&#233;ntalo de nuevo.</p>
              <button onclick="location.href='$APP_URL'">Reintentar</button>
            </main>
          </body>
          </html>
          AIRA_EOF

          cat > scripts/patch-android.mjs <<'AIRA_EOF'
          // Agrega al AndroidManifest los permisos que usa AIRA Alhue (camara y ubicacion).
          // Se ejecuta DESPUES de "npx cap add android". Se puede correr varias veces sin duplicar nada.
          import { existsSync, readFileSync, writeFileSync } from "node:fs";

          const file = process.argv[2] ?? "android/app/src/main/AndroidManifest.xml";

          if (!existsSync(file)) {
            console.error(`No encuentro ${file}. Ejecuta primero: npx cap add android`);
            process.exit(1);
          }

          const entries = [
            { key: "android.permission.INTERNET", xml: '<uses-permission android:name="android.permission.INTERNET" />' },
            { key: "android.permission.CAMERA", xml: '<uses-permission android:name="android.permission.CAMERA" />' },
            { key: "android.permission.ACCESS_COARSE_LOCATION", xml: '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' },
            { key: "android.permission.ACCESS_FINE_LOCATION", xml: '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' },
            // required="false": asi la app tambien se puede instalar en equipos sin camara o sin GPS.
            { key: "android.hardware.camera", xml: '<uses-feature android:name="android.hardware.camera" android:required="false" />' },
            { key: "android.hardware.location.gps", xml: '<uses-feature android:name="android.hardware.location.gps" android:required="false" />' },
          ];

          let manifest = readFileSync(file, "utf8");
          const added = [];

          for (const { key, xml } of entries) {
            if (!manifest.includes(`"${key}"`)) {
              manifest = manifest.replace("</manifest>", `    ${xml}\n</manifest>`);
              added.push(key);
            }
          }

          if (added.length === 0) {
            console.log("El manifiesto ya tenia todos los permisos. No se cambio nada.");
          } else {
            writeFileSync(file, manifest);
            console.log("Permisos agregados:\n - " + added.join("\n - "));
          }
          AIRA_EOF

          cat > scripts/set-version.mjs <<'AIRA_EOF'
          // Escribe la version de la app en el proyecto de Android.
          // Uso: node scripts/set-version.mjs <versionName> <versionCode>
          // Ejemplo: node scripts/set-version.mjs 1.0.0 7
          import { existsSync, readFileSync, writeFileSync } from "node:fs";

          const [versionName, versionCode] = process.argv.slice(2);

          if (!/^\d+(\.\d+){0,2}$/.test(versionName ?? "") || !/^\d+$/.test(versionCode ?? "")) {
            console.error("Uso: node scripts/set-version.mjs <versionName> <versionCode>   (ej.: 1.0.0 7)");
            process.exit(1);
          }

          const candidates = ["android/app/build.gradle", "android/app/build.gradle.kts"];
          const file = candidates.find((f) => existsSync(f));
          if (!file) {
            console.error("No encuentro android/app/build.gradle. Ejecuta primero: npx cap add android");
            process.exit(1);
          }

          let text = readFileSync(file, "utf8");
          const codeRe = /(versionCode\s*=?\s*)\d+/;
          const nameRe = /(versionName\s*=?\s*)"[^"]*"/;

          if (!codeRe.test(text) || !nameRe.test(text)) {
            console.error(`No pude encontrar versionCode y versionName en ${file}.`);
            process.exit(1);
          }

          text = text.replace(codeRe, (_, prefix) => prefix + versionCode);
          text = text.replace(nameRe, (_, prefix) => `${prefix}"${versionName}"`);
          writeFileSync(file, text);
          console.log(`Version escrita en ${file}: versionName="${versionName}", versionCode=${versionCode}`);
          AIRA_EOF

